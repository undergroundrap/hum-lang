[package]
name = "hum-lang"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace]
members = ["crates/hum-dev", "crates/hum-sha256", "crates/windows-drive-locality"]
exclude = [
    "experiments/cranelift-feasibility",
    "experiments/cranelift-lowering-contract",
    "experiments/effect-bakeoff",
]
resolver = "3"

[[bin]]
name = "hum"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { version = "=0.133.1", default-features = false, features = ["std", "unwind", "host-arch"] }
cranelift-frontend = { version = "=0.133.1", default-features = false, features = ["std"] }
cranelift-jit = { version = "=0.133.1", default-features = false }
cranelift-module = { version = "=0.133.1", default-features = false, features = ["std"] }
cranelift-native = { version = "=0.133.1", default-features = false, features = ["std"] }
hum-sha256 = { path = "crates/hum-sha256" }
windows-drive-locality = { path = "crates/windows-drive-locality" }
