name: validation

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      boundary_required: ${{ steps.select.outputs.boundary_required }}
      base: ${{ steps.select.outputs.base }}
      head: ${{ steps.select.outputs.head }}
      integration: ${{ steps.select.outputs.integration }}
      tree: ${{ steps.select.outputs.tree }}
      run: ${{ steps.select.outputs.run }}
      attempt: ${{ steps.select.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select accepted-policy route
        id: select
        shell: pwsh
        env:
          HUM_EVENT: ${{ github.event_name }}
          HUM_BASE: ${{ github.event.pull_request.base.sha }}
          HUM_BASE_REF: ${{ github.event.pull_request.base.ref }}
          HUM_HEAD: ${{ github.event.pull_request.head.sha }}
          HUM_INTEGRATION: ${{ github.sha }}
          HUM_FULL_REQUESTED: ${{ contains(github.event.pull_request.labels.*.name, 'hum-full-validation') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ShaPattern = '\A[0-9a-f]{40}\z'
          if ($env:HUM_INTEGRATION -cnotmatch $ShaPattern) { throw 'integration SHA is malformed' }
          $Tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $Tree -cnotmatch $ShaPattern) { throw 'integration tree is unavailable' }
          $Actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $Actual -cne $env:HUM_INTEGRATION) { throw 'checkout differs from event integration' }
          $Profile = 'full'
          $AcceptedBase = $env:HUM_BASE
          if ($env:HUM_EVENT -ceq 'pull_request') {
            if ($env:HUM_BASE -cnotmatch $ShaPattern -or $env:HUM_HEAD -cnotmatch $ShaPattern) { throw 'PR identity is malformed' }
            # The event's base.sha goes stale when the target branch moves after GitHub
            # builds the test merge commit, so it can never be trusted for the policy
            # read. The merge commit's first parent is the accepted base by
            # construction: verify the commit shape, verify the second parent is the
            # event head, and verify the base is on the target branch.
            $ParentsRaw = git rev-list --parents -n 1 $env:HUM_INTEGRATION
            if ($LASTEXITCODE -ne 0) { throw 'integration parents are unavailable' }
            $ParentIds = @($ParentsRaw.Trim() -split '\s+')
            if ($ParentIds.Count -ne 3 -or $ParentIds[0] -cne $env:HUM_INTEGRATION) { throw 'integration is not a two-parent merge of the event revision' }
            $AcceptedBase = $ParentIds[1]
            if ($ParentIds[2] -cne $env:HUM_HEAD) { throw 'integration second parent differs from event head' }
            if ([string]::IsNullOrEmpty($env:HUM_BASE_REF)) { throw 'event base ref is missing' }
            # Fetch the target tip without --depth: a depth-limited fetch would
            # mark this full clone shallow and force every PR to Full.
            git fetch --no-tags origin "+refs/heads/$($env:HUM_BASE_REF):refs/hum/verified-base-tip" 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'target branch tip is unavailable' }
            git merge-base --is-ancestor $AcceptedBase 'refs/hum/verified-base-tip' 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'accepted base is not on the target branch' }
            $global:LASTEXITCODE = 0
            # Only the accepted base selects a cheaper route. No proposed-script fallback.
            # Probe for the policy without minting a read failure: cat-file -e exits 0
            # iff the path exists on the accepted base. A missing path is the bootstrap
            # case; an unreadable base commit is a real Git failure and still throws.
            git cat-file -e "$($AcceptedBase):tools/check_ci_policy.ps1" 2>$null
            $PolicyPresent = ($LASTEXITCODE -eq 0)
            if (-not $PolicyPresent) {
              git cat-file -e "$($AcceptedBase)^{commit}" 2>$null
              if ($LASTEXITCODE -ne 0) { throw 'accepted base commit is unreadable' }
            }
            if ($PolicyPresent) {
              $Policy = git show "$($AcceptedBase):tools/check_ci_policy.ps1" 2>$null
              if ($LASTEXITCODE -ne 0) { throw 'accepted policy read failed' }
              $PolicyPath = Join-Path $env:RUNNER_TEMP ('hum-accepted-policy-' + [Guid]::NewGuid().ToString('N') + '.ps1')
              try {
                [IO.File]::WriteAllText($PolicyPath, ($Policy -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
                # The policy script opens with a param() block; dot-sourcing it in the
                # step scope would leak its variables into the step. The policy and
                # everything that consumes it run in a child scope; only the selected
                # profile crosses the boundary.
                $Profile = & {
                  . $PolicyPath
                  $InnerSelection = Get-HumCiSelection (Get-Location).Path $AcceptedBase $env:HUM_HEAD $env:HUM_INTEGRATION
                  if ($InnerSelection.Tree -cne $Tree) { throw 'selection tree disagreement' }
                  $InnerProfile = $InnerSelection.Profile
                  # The owner may separately authorize this coverage-increasing label.
                  if ($env:HUM_FULL_REQUESTED -ceq 'true') { $InnerProfile = 'full' }
                  if ($InnerProfile -cne 'full') {
                    $Json = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/validation.yml/runs?branch=main&per_page=10"
                    if ($LASTEXITCODE -ne 0) { throw 'integration health metadata unavailable' }
                    $Runs = @(($Json | ConvertFrom-Json).workflow_runs)
                    $Health = Assert-HumIntegrationHealth $Runs ([datetimeoffset]::UtcNow) $env:GITHUB_REPOSITORY
                    $JobJson = gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/actions/runs/$($Health.id)/attempts/$($Health.run_attempt)/jobs?per_page=100"
                    if ($LASTEXITCODE -ne 0) { throw 'integration job metadata unavailable' }
                    $Jobs = @(($JobJson | ConvertFrom-Json) | ForEach-Object { $_.jobs })
                    Assert-HumIntegrationJobs $Jobs $Health
                    "health_run=$($Health.id);health_attempt=$($Health.run_attempt);health_sha=$($Health.head_sha)" >> $env:GITHUB_STEP_SUMMARY
                  }
                  # Decision 0025 amendment (2026-09-23, boolean transport):
                  # publish boundary_required — whether the fixed profiles must
                  # run the status-boundary classifier tests — computed here
                  # from the ACCEPTED BASE policy's trigger function against
                  # the same classified paths that selected the profile. Only
                  # a boolean crosses the step boundary: check_all never sees
                  # the path inventory and never dot-sources the PR's policy.
                  # A PR editing the trigger function cannot change its own
                  # decision. Published only once the selection is accepted
                  # (after the health gate); a rejected selection publishes
                  # nothing (missing output fails safe: the tests run).
                  $BoundaryRequired = Test-HumCiWorkOrderBoundaryTrigger -Paths $InnerSelection.Paths
                  "boundary_required=$($BoundaryRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
                  $InnerProfile
                }
              } finally { if (Test-Path -LiteralPath $PolicyPath) { Remove-Item -LiteralPath $PolicyPath -Force } }
            } else {
              # Bootstrap is Full, not a fabricated nightly or proposed-policy decision.
              Write-Host 'Accepted base has no profile policy: Full bootstrap evaluation required.'
            }
          } elseif ($env:HUM_EVENT -cnotin @('schedule','workflow_dispatch')) { throw 'unsupported validation event' }
          "profile=$Profile" >> $env:GITHUB_OUTPUT
          "base=$AcceptedBase" >> $env:GITHUB_OUTPUT
          "head=$env:HUM_HEAD" >> $env:GITHUB_OUTPUT
          "integration=$env:HUM_INTEGRATION" >> $env:GITHUB_OUTPUT
          "tree=$Tree" >> $env:GITHUB_OUTPUT
          "run=$env:GITHUB_RUN_ID" >> $env:GITHUB_OUTPUT
          "attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
          "profile=$Profile;base=$AcceptedBase;head=$env:HUM_HEAD;integration=$env:HUM_INTEGRATION;tree=$Tree;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_STEP_SUMMARY

  evaluate:
    needs: plan
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      profile: ${{ needs.plan.outputs.profile }}
      integration: ${{ needs.plan.outputs.integration }}
      tree: ${{ needs.plan.outputs.tree }}
      boundary_required: ${{ needs.plan.outputs.boundary_required }}
      windows_full_split: ${{ github.event_name == 'pull_request' && needs.plan.outputs.profile == 'full' }}

  windows_mutations:
    name: Windows Full WO22, WO23 and compiler corpus
    if: github.event_name == 'pull_request' && needs.plan.outputs.profile == 'full'
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
    outputs:
      proof: ${{ steps.mutation_completion.outputs.proof }}
      corpus_proof: ${{ steps.mutation_completion.outputs.corpus_proof }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.integration }}
      - name: Prepare Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows mutation campaigns
        id: mutations
        shell: pwsh
        env:
          HUM_EXPECTED_INTEGRATION: ${{ needs.plan.outputs.integration }}
          HUM_EXPECTED_TREE: ${{ needs.plan.outputs.tree }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-WindowsFullMutationOutput([byte[]] $Bytes) {
            $OutputText = [Text.UTF8Encoding]::new($false, $true).GetString($Bytes)
            $Footers = [regex]::Matches($OutputText, '(?m)^Windows Full part completed: [^\r\n]*\r?$')
            if ($Footers.Count -ne 1 -or $Footers[0].Value.TrimEnd([char]13) -cne 'Windows Full part completed: mutations' -or
                -not $OutputText.TrimEnd([char[]]@(13,10)).EndsWith('Windows Full part completed: mutations', [StringComparison]::Ordinal) -or
                $OutputText -cmatch '(?m)^All Hum preflight checks passed\.\r?$') { throw 'Windows mutation completion footer disagrees' }
            $Rows = @([regex]::Matches($OutputText, '(?m)^ok - Work Order (?:22|23) [^\r\n]+ production mutation rejected\r?$') |
              ForEach-Object { $_.Value.TrimEnd([char]13) })
            # Digest of the 29 ordered full row labels, LF joined without a final LF.
            $RowDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($Rows -join [char]10)))).ToLowerInvariant()
            if ($Rows.Count -ne 29 -or $RowDigest -cne '00fb7261b1797361d492dfafc2143d945add3fd5028fd14837130310b8292d24') {
              throw 'Windows mutation evidence inventory disagrees'
            }
          }
          if (-not $IsWindows -or $env:RUNNER_OS -cne 'Windows' -or $PSVersionTable.PSVersion.Major -ne 7 -or
              $env:GITHUB_EVENT_NAME -cne 'pull_request' -or -not [IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP) -or
              $env:GITHUB_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $env:GITHUB_RUN_ID -cnotmatch '\A[1-9][0-9]*\z' -or
              $env:GITHUB_RUN_ATTEMPT -cnotmatch '\A[1-9][0-9]*\z' -or $env:HUM_EXPECTED_TREE -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Windows mutation runner context is invalid'
          }
          $Actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $Actual -cne $env:HUM_EXPECTED_INTEGRATION -or $Actual -cne $env:GITHUB_SHA) { throw 'Windows mutation integration mismatch' }
          $Tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $Tree -cne $env:HUM_EXPECTED_TREE) { throw 'Windows mutation tree mismatch' }
          $Pwsh = Join-Path $PSHOME 'pwsh.exe'
          $PwshItem = Get-Item -LiteralPath $Pwsh -Force
          if ($PwshItem.PSIsContainer -or ($PwshItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not [string]::Equals($PwshItem.FullName, (Get-Process -Id $PID).Path, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Windows mutation PowerShell identity mismatch'
          }
          . ./tools/run_fast_evidence.ps1
          $Root = (Get-Location).Path
          $Rustc = (Get-Command rustc -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          $ToolchainDir = Join-Path $env:RUNNER_TEMP ('hum-windows-mutation-toolchain-' + [Guid]::NewGuid().ToString('N'))
          $CaptureDir = Join-Path $env:RUNNER_TEMP ('hum-windows-mutation-capture-' + [Guid]::NewGuid().ToString('N'))
          $PhaseDir = Join-Path $env:RUNNER_TEMP ('hum-phase-diagnostics-' + [Guid]::NewGuid().ToString('N'))
          "toolchain_dir=$ToolchainDir" >> $env:GITHUB_OUTPUT
          "capture_dir=$CaptureDir" >> $env:GITHUB_OUTPUT
          $Toolchain = Assert-HumCaptureComplete (Invoke-HumBinaryCapture $Rustc @('-Vv') $Root $ToolchainDir 4500 -CaseName 'ci-windows-mutation-toolchain')
          if ($Toolchain.ExitCode -ne 0 -or $Toolchain.TimedOut) { throw 'Windows mutation rustc identity failed' }
          $ToolchainBytes = [IO.File]::ReadAllBytes($Toolchain.StdoutPath)
          if ($ToolchainBytes.Length -eq 0 -or [Array]::IndexOf($ToolchainBytes, [byte]0) -ge 0) { throw 'Windows mutation rustc identity is malformed' }
          [void][Text.UTF8Encoding]::new($false, $true).GetString($ToolchainBytes)
          $ToolchainDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($ToolchainBytes)).ToLowerInvariant()
          if ($ToolchainDigest -cne $Toolchain.StdoutSha256) { throw 'Windows mutation rustc identity changed after capture' }
          $env:HUM_BUILD_TOOLCHAIN = 'utf8-base64:' + [Convert]::ToBase64String($ToolchainBytes)
          $env:HUM_BUILD_TARGET = 'x86_64-pc-windows-msvc'
          cargo build -p hum-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            [void][IO.Directory]::CreateDirectory($PhaseDir)
            $Binding = "run_id=$env:GITHUB_RUN_ID" + [char]10 + "binding_guid=$([Guid]::NewGuid().ToString('N'))" + [char]10 + "created_utc=$([DateTime]::UtcNow.ToString('o'))" + [char]10
            [IO.File]::WriteAllText((Join-Path $PhaseDir 'run-binding.txt'), $Binding, [Text.Encoding]::UTF8)
            "phase_dir=$PhaseDir" >> $env:GITHUB_OUTPUT
          } catch { Write-Warning "Windows mutation phase diagnostics unavailable: $($_.Exception.Message)" }
          $Ticket = Join-Path $env:RUNNER_TEMP "hum-windows-full-part-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $TicketBytes = [Text.Encoding]::UTF8.GetBytes("mutations|$env:GITHUB_SHA|$env:GITHUB_RUN_ID|$env:GITHUB_RUN_ATTEMPT")
          $TicketStream = [IO.File]::Open($Ticket, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try {
            try { $TicketStream.Write($TicketBytes, 0, $TicketBytes.Length) } finally { $TicketStream.Dispose() }
            $Isolated = New-HumIsolatedExecutable 'target/debug/hum-dev.exe' $env:RUNNER_TEMP 'target'
            try {
              Assert-HumIsolatedExecutable $Isolated -RequireSource
              $Arguments = @('evidence','full','--pwsh',$Pwsh,'--phase-diagnostics',$PhaseDir)
              $Capture = Assert-HumCaptureComplete (Invoke-HumBinaryCapture $Isolated.Executable $Arguments $Root $CaptureDir 4500 -CaseName 'ci-windows-mutations' -PhaseDiagnosticDirectory $PhaseDir)
              $Bytes = [IO.File]::ReadAllBytes($Capture.StdoutPath)
              $Stderr = [IO.File]::ReadAllBytes($Capture.StderrPath)
              [Console]::OpenStandardOutput().Write($Bytes, 0, $Bytes.Length)
              [Console]::OpenStandardError().Write($Stderr, 0, $Stderr.Length)
              if ($Capture.ExitCode -ne 0 -or $Capture.TimedOut) { throw "Windows mutations failed with exit $($Capture.ExitCode)" }
              $StdoutDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($Bytes)).ToLowerInvariant()
              if ($StdoutDigest -cne $Capture.StdoutSha256) { throw 'Windows mutation stdout changed after capture authentication' }
              Assert-WindowsFullMutationOutput $Bytes
            } finally { Remove-HumIsolatedExecutable $Isolated }
          } finally { [IO.File]::Delete($Ticket) }
          "proof=mutations|windows-latest|full|$Actual|$Tree|$env:GITHUB_RUN_ID|$env:GITHUB_RUN_ATTEMPT|$ToolchainDigest|$StdoutDigest" >> $env:GITHUB_OUTPUT
      - name: Retain Windows mutation capture
        id: retain_mutations
        if: always() && steps.mutations.outputs.toolchain_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hum-windows-mutations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.mutations.outputs.toolchain_dir }}
            ${{ steps.mutations.outputs.capture_dir }}
            ${{ steps.mutations.outputs.phase_dir }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
      - name: Run Windows compiler corpus
        id: corpus
        shell: pwsh
        env:
          HUM_EXPECTED_INTEGRATION: ${{ needs.plan.outputs.integration }}
          HUM_EXPECTED_TREE: ${{ needs.plan.outputs.tree }}
          HUM_MUTATION_PROOF: ${{ steps.mutations.outputs.proof }}
          HUM_MUTATION_TOOLCHAIN_DIR: ${{ steps.mutations.outputs.toolchain_dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-WindowsFullCorpusCompilerHash([byte[]] $Bytes) {
            $OutputText = [Text.UTF8Encoding]::new($false, $true).GetString($Bytes)
            $Footers = [regex]::Matches($OutputText, '(?m)^Windows Full part completed: [^\r\n]*\r?$')
            if ($Footers.Count -ne 1 -or $Footers[0].Value.TrimEnd([char]13) -cne 'Windows Full part completed: corpus' -or
                -not $OutputText.TrimEnd([char[]]@(13,10)).EndsWith('Windows Full part completed: corpus', [StringComparison]::Ordinal) -or
                $OutputText -cmatch '(?m)^(?:All Hum preflight checks passed\.|ok - Work Order (?:22|23) [^\r\n]+ production mutation rejected)\r?$') {
              throw 'Windows corpus completion footer or role disagrees'
            }
            $Compiler = [regex]::Matches($OutputText, '(?m)^Windows Full corpus compiler sha256=[^\r\n]*\r?$')
            if ($Compiler.Count -ne 1) { throw 'Windows corpus compiler identity is missing or ambiguous' }
            $Digest = [regex]::Match($Compiler[0].Value, '\AWindows Full corpus compiler sha256=(?<sha>[0-9a-f]{64})\r?\z')
            if (-not $Digest.Success -or
                [regex]::Matches($OutputText, '(?m)^==> editor fixture recovery\r?$').Count -ne 1) {
              throw 'Windows corpus compiler or editor fixture evidence is missing or ambiguous'
            }
            $Digest.Groups['sha'].Value
          }
          if (-not $IsWindows -or $env:RUNNER_OS -cne 'Windows' -or $PSVersionTable.PSVersion.Major -ne 7 -or
              $env:GITHUB_EVENT_NAME -cne 'pull_request' -or -not [IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP) -or
              $env:GITHUB_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $env:GITHUB_RUN_ID -cnotmatch '\A[1-9][0-9]*\z' -or
              $env:GITHUB_RUN_ATTEMPT -cnotmatch '\A[1-9][0-9]*\z' -or $env:HUM_EXPECTED_TREE -cnotmatch '\A[0-9a-f]{40}\z') {
            throw 'Windows corpus runner context is invalid'
          }
          $Actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $Actual -cne $env:HUM_EXPECTED_INTEGRATION -or $Actual -cne $env:GITHUB_SHA) { throw 'Windows corpus integration mismatch' }
          $Tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $Tree -cne $env:HUM_EXPECTED_TREE) { throw 'Windows corpus tree mismatch' }
          $Identity = [regex]::Escape("mutations|windows-latest|full|$Actual|$Tree|$env:GITHUB_RUN_ID|$env:GITHUB_RUN_ATTEMPT")
          $Mutation = [regex]::Match($env:HUM_MUTATION_PROOF, ('\A' + $Identity + '\|(?<toolchain>[0-9a-f]{64})\|[0-9a-f]{64}\z'))
          if (-not $Mutation.Success) { throw 'Windows corpus requires restored same-run mutations' }

          $Pwsh = Join-Path $PSHOME 'pwsh.exe'
          $PwshItem = Get-Item -LiteralPath $Pwsh -Force
          if ($PwshItem.PSIsContainer -or ($PwshItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              -not [string]::Equals($PwshItem.FullName, (Get-Process -Id $PID).Path, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Windows corpus PowerShell identity mismatch'
          }
          $ToolchainDir = Get-Item -LiteralPath $env:HUM_MUTATION_TOOLCHAIN_DIR -Force
          if (-not $ToolchainDir.PSIsContainer -or ($ToolchainDir.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $ToolchainDir.Name -cnotmatch '\Ahum-windows-mutation-toolchain-[0-9a-f]{32}\z' -or
              $ToolchainDir.Parent.FullName -cne [IO.Path]::TrimEndingDirectorySeparator($env:RUNNER_TEMP)) {
            throw 'Windows corpus toolchain capture is foreign'
          }
          $ToolchainFile = Get-Item -LiteralPath (Join-Path $ToolchainDir.FullName 'stdout.bin') -Force
          if ($ToolchainFile.PSIsContainer -or ($ToolchainFile.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Windows corpus toolchain capture is not ordinary'
          }
          $ToolchainBytes = [IO.File]::ReadAllBytes($ToolchainFile.FullName)
          $ToolchainDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($ToolchainBytes)).ToLowerInvariant()
          if ($ToolchainDigest -cne $Mutation.Groups['toolchain'].Value) { throw 'Windows corpus toolchain binding disagrees' }
          $env:HUM_BUILD_TOOLCHAIN = 'utf8-base64:' + [Convert]::ToBase64String($ToolchainBytes)
          $env:HUM_BUILD_TARGET = 'x86_64-pc-windows-msvc'

          . ./tools/run_fast_evidence.ps1
          $Root = (Get-Location).Path
          $CaptureDir = Join-Path $env:RUNNER_TEMP ('hum-windows-corpus-capture-' + [Guid]::NewGuid().ToString('N'))
          $PhaseDir = Join-Path $env:RUNNER_TEMP ('hum-phase-diagnostics-' + [Guid]::NewGuid().ToString('N'))
          "capture_dir=$CaptureDir" >> $env:GITHUB_OUTPUT
          try {
            [void][IO.Directory]::CreateDirectory($PhaseDir)
            $Binding = "run_id=$env:GITHUB_RUN_ID" + [char]10 + "binding_guid=$([Guid]::NewGuid().ToString('N'))" + [char]10 + "created_utc=$([DateTime]::UtcNow.ToString('o'))" + [char]10
            [IO.File]::WriteAllText((Join-Path $PhaseDir 'run-binding.txt'), $Binding, [Text.Encoding]::UTF8)
            "phase_dir=$PhaseDir" >> $env:GITHUB_OUTPUT
          } catch { Write-Warning "Windows corpus phase diagnostics unavailable: $($_.Exception.Message)" }
          $Ticket = Join-Path $env:RUNNER_TEMP "hum-windows-full-part-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $TicketBytes = [Text.Encoding]::UTF8.GetBytes("corpus|$Actual|$env:GITHUB_RUN_ID|$env:GITHUB_RUN_ATTEMPT")
          $TicketStream = [IO.File]::Open($Ticket, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try {
            try { $TicketStream.Write($TicketBytes, 0, $TicketBytes.Length) } finally { $TicketStream.Dispose() }
            $Isolated = New-HumIsolatedExecutable 'target/debug/hum-dev.exe' $env:RUNNER_TEMP 'target'
            try {
              Assert-HumIsolatedExecutable $Isolated -RequireSource
              $Arguments = @('evidence','full','--pwsh',$Pwsh,'--phase-diagnostics',$PhaseDir)
              $Capture = Assert-HumCaptureComplete (Invoke-HumBinaryCapture $Isolated.Executable $Arguments $Root $CaptureDir 4500 -CaseName 'ci-windows-corpus' -PhaseDiagnosticDirectory $PhaseDir)
              $Bytes = [IO.File]::ReadAllBytes($Capture.StdoutPath)
              $Stderr = [IO.File]::ReadAllBytes($Capture.StderrPath)
              [Console]::OpenStandardOutput().Write($Bytes, 0, $Bytes.Length)
              [Console]::OpenStandardError().Write($Stderr, 0, $Stderr.Length)
              if ($Capture.ExitCode -ne 0 -or $Capture.TimedOut) { throw "Windows corpus failed with exit $($Capture.ExitCode)" }
              $StdoutDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($Bytes)).ToLowerInvariant()
              if ($StdoutDigest -cne $Capture.StdoutSha256) { throw 'Windows corpus stdout changed after capture authentication' }
              $CompilerHash = Get-WindowsFullCorpusCompilerHash $Bytes
            } finally { Remove-HumIsolatedExecutable $Isolated }
          } finally { [IO.File]::Delete($Ticket) }
          $After = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $After -cne $Actual) { throw 'Windows corpus changed its integration' }
          "proof=corpus|windows-latest|full|$Actual|$Tree|$env:GITHUB_RUN_ID|$env:GITHUB_RUN_ATTEMPT|$ToolchainDigest|$StdoutDigest|$CompilerHash" >> $env:GITHUB_OUTPUT
      - name: Retain Windows corpus capture
        id: retain_corpus
        if: always() && steps.corpus.outputs.capture_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hum-windows-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.corpus.outputs.capture_dir }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
      - name: Retain Windows corpus phase diagnostics
        if: always() && steps.corpus.outputs.phase_dir != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hum-windows-corpus-phase-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.corpus.outputs.phase_dir }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
          overwrite: false
      - name: Confirm Windows mutation and corpus completion
        id: mutation_completion
        if: always()
        shell: pwsh
        env:
          HUM_MUTATION_STEPS: ${{ toJSON(steps) }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-WindowsSidecarCompletedProofs($Steps) {
            foreach ($Name in @('mutations','retain_mutations','corpus','retain_corpus')) {
              if ($Steps.$Name.outcome -cne 'success' -or $Steps.$Name.conclusion -cne 'success') { throw "required Windows sidecar step incomplete: $Name" }
            }
            $Proof = $Steps.mutations.outputs.proof
            if ($Proof -isnot [string] -or
                $Proof -cnotmatch '\Amutations\|windows-latest\|full\|[0-9a-f]{40}\|[0-9a-f]{40}\|[1-9][0-9]*\|[1-9][0-9]*\|[0-9a-f]{64}\|[0-9a-f]{64}\z') { throw 'Windows mutation proof is absent or malformed' }
            $Corpus = $Steps.corpus.outputs.proof
            if ($Corpus -isnot [string] -or
                $Corpus -cnotmatch '\Acorpus\|windows-latest\|full\|[0-9a-f]{40}\|[0-9a-f]{40}\|[1-9][0-9]*\|[1-9][0-9]*\|[0-9a-f]{64}\|[0-9a-f]{64}\|[0-9a-f]{64}\z') { throw 'Windows corpus proof is absent or malformed' }
            if ($Steps.retain_corpus.outputs.'artifact-id' -cnotmatch '\A[1-9][0-9]*\z') { throw 'Windows corpus capture upload has no artifact ID' }
            $Directory = $Steps.corpus.outputs.capture_dir
            if ($Directory -isnot [string] -or [string]::IsNullOrEmpty($Directory)) { throw 'Windows corpus capture directory is absent' }
            $Capture = Assert-HumCaptureComplete @{CaptureDirectory=$Directory}
            if ($Capture.CaseName -cne 'ci-windows-corpus' -or $Capture.ExitCode -ne 0 -or $Capture.TimedOut -or
                $Capture.StdoutSha256 -cne $Corpus.Split('|')[8]) { throw 'retained Windows corpus capture disagrees with its proof' }
            [pscustomobject]@{Mutation=$Proof; Corpus=$Corpus}
          }
          . ./tools/run_fast_evidence.ps1
          $Proofs = Get-WindowsSidecarCompletedProofs ($env:HUM_MUTATION_STEPS | ConvertFrom-Json)
          "proof=$($Proofs.Mutation)" >> $env:GITHUB_OUTPUT
          "corpus_proof=$($Proofs.Corpus)" >> $env:GITHUB_OUTPUT

  required:
    name: Hum required validation
    if: always()
    needs: [plan, evaluate, windows_mutations]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require explicit success
        shell: pwsh
        env:
          HUM_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-UniqueNeedFields([Text.Json.JsonElement] $Object) {
            if ($Object.ValueKind -ne [Text.Json.JsonValueKind]::Object) { throw 'required-work record is not an object' }
            $Names = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($Field in $Object.EnumerateObject()) {
              if (-not $Names.Add($Field.Name)) { throw "duplicate required-work field: $($Field.Name)" }
              if ($Field.Value.ValueKind -eq [Text.Json.JsonValueKind]::Object) { Assert-UniqueNeedFields $Field.Value }
              if ($Field.Value.ValueKind -eq [Text.Json.JsonValueKind]::Array) { throw "unexpected required-work array: $($Field.Name)" }
            }
          }
          $Document = [Text.Json.JsonDocument]::Parse($env:HUM_CI_NEEDS)
          try { Assert-UniqueNeedFields $Document.RootElement } finally { $Document.Dispose() }
          $Needs = $env:HUM_CI_NEEDS | ConvertFrom-Json
          if ((($Needs.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'evaluate,plan,windows_mutations') { throw 'missing or unexpected required work' }
          foreach ($Name in @('plan','evaluate')) {
            if ($Needs.$Name.result -isnot [string] -or $Needs.$Name.result -cne 'success') { throw "required work did not succeed: $Name" }
          }
          if ($Needs.plan.outputs.profile -cnotin @('language','runtime','compiler','full')) { throw 'missing selected profile' }
          foreach ($Name in @('integration','tree')) {
            if ($Needs.plan.outputs.$Name -cnotmatch '\A[0-9a-f]{40}\z') { throw "missing provenance: $Name" }
          }
          if ($Needs.plan.outputs.integration -cne $env:GITHUB_SHA -or
              $Needs.plan.outputs.run -cne $env:GITHUB_RUN_ID -or
              $Needs.plan.outputs.attempt -cne $env:GITHUB_RUN_ATTEMPT -or
              $Needs.plan.outputs.run -cnotmatch '\A[1-9][0-9]*\z' -or
              $Needs.plan.outputs.attempt -cnotmatch '\A[1-9][0-9]*\z') { throw 'stale run/attempt/integration provenance' }
          if ($env:GITHUB_EVENT_NAME -ceq 'pull_request') {
            foreach ($Name in @('base','head')) {
              if ($Needs.plan.outputs.$Name -cnotmatch '\A[0-9a-f]{40}\z') { throw "missing PR provenance: $Name" }
            }
          }
          $Main = $Needs.evaluate.outputs.windows_full_main
          $Mutations = $Needs.windows_mutations.outputs.proof
          $Corpus = $Needs.windows_mutations.outputs.corpus_proof
          $SidecarResult = $Needs.windows_mutations.result
          if ($env:GITHUB_EVENT_NAME -ceq 'pull_request' -and $Needs.plan.outputs.profile -ceq 'full') {
            if ($SidecarResult -isnot [string] -or $SidecarResult -cne 'success') { throw 'required Windows Full sidecar did not succeed' }
            $Plan = $Needs.plan.outputs
            $Identity = [regex]::Escape("windows-latest|full|$($Plan.integration)|$($Plan.tree)|$($Plan.run)|$($Plan.attempt)")
            $Digests = '\|(?<toolchain>[0-9a-f]{64})\|(?<stdout>[0-9a-f]{64})'
            if ($Main -isnot [string] -or $Mutations -isnot [string] -or $Corpus -isnot [string]) { throw 'Windows Full part proof is missing' }
            $MainProof = [regex]::Match($Main, ('\Amain\|' + $Identity + $Digests + '\z'))
            $MutationProof = [regex]::Match($Mutations, ('\Amutations\|' + $Identity + $Digests + '\z'))
            $CorpusProof = [regex]::Match($Corpus, ('\Acorpus\|' + $Identity + $Digests + '\|[0-9a-f]{64}\z'))
            $Proofs = @($MainProof, $MutationProof, $CorpusProof)
            $Transcripts = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($Proof in $Proofs) {
              if (-not $Proof.Success -or $Proof.Groups['toolchain'].Value -cne $MainProof.Groups['toolchain'].Value -or
                  -not $Transcripts.Add($Proof.Groups['stdout'].Value)) { throw 'Windows Full part proofs disagree with the selected work' }
            }
          } elseif ($SidecarResult -isnot [string] -or $SidecarResult -cne 'skipped' -or $Main -or $Mutations -or
                    ($null -ne $Corpus -and ($Corpus -isnot [string] -or $Corpus -cne ''))) {
            throw 'unexpected Windows Full part outside the Full PR route'
          }
          Write-Host 'Selected work succeeded. Review definitions and exact run before owner-authorized integration; this badge is not attestation.'
