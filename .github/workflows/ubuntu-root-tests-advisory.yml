name: Hum Ubuntu advisory

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  root-tests:
    name: Hum Ubuntu root tests (advisory)
    if: >-
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'pilot/hum-ubuntu-advisory-20261118-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: hum-ubuntu-root-tests-advisory-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_TOOLCHAIN: '1.100.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify integration revision
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'integration=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Set up Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustc -Vv
          cargo -V
      - name: Run root Cargo tests
        run: cargo test
